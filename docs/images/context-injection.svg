<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img"><title>一次请求的上下文注入规则</title><desc>总预算由模型窗口推导并经在线校准，切成系统提示、事件区与输出预留；系统提示内部按缓存稳定性分静态、半静态、易变三档，事件区以滚动摘要游标为界。</desc><style>
svg{--bg:#FFFFFF;--card:#F7F6F2;--line:#B4B2A9;--txt:#2C2C2A;--txt2:#5F5E5A;
--pu-bg:#EEEDFE;--pu-ln:#7F77DD;--pu-tx:#26215C;
--te-bg:#E1F5EE;--te-ln:#1D9E75;--te-tx:#04342C;
--co-bg:#FAECE7;--co-ln:#D85A30;--co-tx:#4A1B0C;
--gy-bg:#F1EFE8;--gy-ln:#888780;--gy-tx:#2C2C2A}
@media (prefers-color-scheme:dark){svg{--bg:#1A1A18;--card:#232320;--line:#5F5E5A;--txt:#F1EFE8;--txt2:#B4B2A9;
--pu-bg:#3C3489;--pu-ln:#AFA9EC;--pu-tx:#EEEDFE;
--te-bg:#085041;--te-ln:#5DCAA5;--te-tx:#E1F5EE;
--co-bg:#712B13;--co-ln:#F0997B;--co-tx:#FAECE7;
--gy-bg:#444441;--gy-ln:#B4B2A9;--gy-tx:#F1EFE8}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--txt)}
.th{font-size:14px;font-weight:500;fill:var(--txt)}
.ts{font-size:12px;fill:var(--txt2)}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.dash{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:5 4}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1180" height="560" rx="12" fill="var(--bg)"/><rect x="48" y="48" width="280" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="188" y="74" text-anchor="middle" fill="var(--gy-tx)">模型上下文窗口</text><text class="ts" x="188" y="93" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">× 0.6，clamp 48k–150k</text><line class="ln" x1="328" y1="79" x2="396" y2="79" marker-end="url(#a)"/><rect x="396" y="48" width="240" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="516" y="74" text-anchor="middle" fill="var(--gy-tx)">基准预算</text><text class="ts" x="516" y="93" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">× budget_scale 在线校准</text><line class="ln" x1="636" y1="79" x2="704" y2="79" marker-end="url(#a)"/><rect x="704" y="48" width="240" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="824" y="84" text-anchor="middle" fill="var(--gy-tx)">本轮总预算</text><rect x="48" y="168" width="340" height="62" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="218" y="194" text-anchor="middle" fill="var(--pu-tx)">系统提示</text><text class="ts" x="218" y="213" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">上限 30k</text><path class="ln" d="M824 110 V140 H218 V168" marker-end="url(#a)"/><rect x="420" y="168" width="340" height="62" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="590" y="194" text-anchor="middle" fill="var(--te-tx)">事件区</text><text class="ts" x="590" y="213" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">总预算 − 系统 − 预留</text><path class="ln" d="M824 110 V140 H590 V168" marker-end="url(#a)"/><rect x="792" y="168" width="340" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="962" y="194" text-anchor="middle" fill="var(--gy-tx)">输出预留</text><text class="ts" x="962" y="213" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">7k，恒定</text><path class="ln" d="M824 110 V140 H962 V168" marker-end="url(#a)"/><rect x="24" y="262" width="748" height="156" rx="10" class="dash"/><text class="ts" x="38" y="282">系统提示：顺序＝缓存稳定性，不是阅读顺序</text><rect x="48" y="300" width="220" height="96" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="158" y="334" text-anchor="middle" fill="var(--pu-tx)">静态 · 9 节</text><text class="ts" x="158" y="352" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">整场逐字不变</text><text class="ts" x="158" y="372" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">缓存命中的主体</text><path class="ln" d="M218 230 V256 H158 V300" marker-end="url(#a)"/><rect x="288" y="300" width="220" height="96" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="398" y="334" text-anchor="middle" fill="var(--pu-tx)">半静态 · 2 节</text><text class="ts" x="398" y="352" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">模组数据、幕后真相</text><text class="ts" x="398" y="372" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">同一轮内稳定</text><path class="ln" d="M218 230 V256 H398 V300" marker-end="url(#a)"/><rect x="528" y="300" width="220" height="96" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="638" y="334" text-anchor="middle" fill="var(--pu-tx)">易变 · 13 节</text><text class="ts" x="638" y="352" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">位置、台账、记忆、战斗</text><text class="ts" x="638" y="372" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">排最后不污染前缀</text><path class="ln" d="M218 230 V256 H638 V300" marker-end="url(#a)"/><rect x="800" y="262" width="356" height="156" rx="10" class="dash"/><text class="ts" x="814" y="282">事件区：以滚动摘要游标为界</text><rect x="824" y="300" width="144" height="96" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="896" y="343" text-anchor="middle" fill="var(--te-tx)">游标之前</text><text class="ts" x="896" y="362" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">只给持久摘要</text><path class="ln" d="M590 230 V246 H896 V300" marker-end="url(#a)"/><rect x="988" y="300" width="144" height="96" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="1060" y="334" text-anchor="middle" fill="var(--te-tx)">游标之后</text><text class="ts" x="1060" y="352" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">按预算给全文</text><text class="ts" x="1060" y="372" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">至少 10 条</text><path class="ln" d="M590 230 V246 H1060 V300" marker-end="url(#a)"/><rect x="24" y="442" width="1132" height="96" rx="10" class="dash"/><text class="ts" x="38" y="462">超预算时按 priority 从大到小整段丢弃（判据：丢了能不能捞回来）</text><rect x="48" y="474" width="253" height="50" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="174" y="494" text-anchor="middle" fill="var(--co-tx)">40 · 先丢</text><text class="ts" x="174" y="513" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">模组与规则摘录</text><rect x="325" y="474" width="253" height="50" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="452" y="494" text-anchor="middle" fill="var(--co-tx)">35 → 10</text><text class="ts" x="452" y="513" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">临场、幕后、手书、记忆</text><rect x="602" y="474" width="253" height="50" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="728" y="494" text-anchor="middle" fill="var(--co-tx)">6 → 2</text><text class="ts" x="728" y="513" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">台账、机制点、队伍位置</text><rect x="879" y="474" width="253" height="50" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="1006" y="494" text-anchor="middle" fill="var(--co-tx)">0 · 永不丢</text><text class="ts" x="1006" y="513" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">身份、手册、模组、战斗态</text></svg>
