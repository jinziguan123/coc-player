<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="692" viewBox="0 0 1180 692" role="img"><title>一轮生成的四个阶段</title><desc>回合确认与落库守卫是确定性的 fail-closed 段，中间五个串行 LLM 环节是玩家等待的来源，最后的后台收尾 fail-open、三者彼此独立。</desc><style>
svg{--bg:#FFFFFF;--card:#F7F6F2;--line:#B4B2A9;--txt:#2C2C2A;--txt2:#5F5E5A;
--pu-bg:#EEEDFE;--pu-ln:#7F77DD;--pu-tx:#26215C;
--te-bg:#E1F5EE;--te-ln:#1D9E75;--te-tx:#04342C;
--co-bg:#FAECE7;--co-ln:#D85A30;--co-tx:#4A1B0C;
--gy-bg:#F1EFE8;--gy-ln:#888780;--gy-tx:#2C2C2A}
@media (prefers-color-scheme:dark){svg{--bg:#1A1A18;--card:#232320;--line:#5F5E5A;--txt:#F1EFE8;--txt2:#B4B2A9;
--pu-bg:#3C3489;--pu-ln:#AFA9EC;--pu-tx:#EEEDFE;
--te-bg:#085041;--te-ln:#5DCAA5;--te-tx:#E1F5EE;
--co-bg:#712B13;--co-ln:#F0997B;--co-tx:#FAECE7;
--gy-bg:#444441;--gy-ln:#B4B2A9;--gy-tx:#F1EFE8}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--txt)}
.th{font-size:14px;font-weight:500;fill:var(--txt)}
.ts{font-size:12px;fill:var(--txt2)}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.dash{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:5 4}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1180" height="692" rx="12" fill="var(--bg)"/><rect x="24" y="36" width="1132" height="116" rx="10" class="dash"/><text class="ts" x="38" y="56">一、回合确认（确定性）</text><rect x="48" y="72" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="215" y="98" text-anchor="middle" fill="var(--gy-tx)">POST /chat</text><text class="ts" x="215" y="117" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">暂存本轮发言</text><rect x="422" y="72" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="589" y="98" text-anchor="middle" fill="var(--gy-tx)">POST /advance</text><text class="ts" x="589" y="117" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">需确认的真人都点过</text><rect x="796" y="72" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="963" y="98" text-anchor="middle" fill="var(--gy-tx)">commit_turn</text><text class="ts" x="963" y="117" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">暂存转正，触发生成</text><line class="ln" x1="382" y1="103" x2="422" y2="103" marker-end="url(#a)"/><line class="ln" x1="756" y1="103" x2="796" y2="103" marker-end="url(#a)"/><rect x="370" y="184" width="440" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="590" y="210" text-anchor="middle" fill="var(--gy-tx)">GenerationManager.start</text><text class="ts" x="590" y="229" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">全应用唯一生成入口：并发锁 + 房间配额</text><line class="ln" x1="590" y1="152" x2="590" y2="184" marker-end="url(#a)"/><rect x="24" y="278" width="1132" height="122" rx="10" class="dash"/><text class="ts" x="38" y="298">二、串行 LLM 环节（玩家等待的来源；紫＝快模型，绿＝主模型）</text><rect x="48" y="312" width="199" height="66" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="148" y="340" text-anchor="middle" fill="var(--pu-tx)">① TurnPlan</text><text class="ts" x="148" y="359" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">快模型 · 温度 0</text><rect x="269" y="312" width="199" height="66" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="368" y="340" text-anchor="middle" fill="var(--te-tx)">② AI 队友回合</text><text class="ts" x="368" y="359" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">主模型 · 玩家直接看到</text><rect x="490" y="312" width="199" height="66" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="590" y="340" text-anchor="middle" fill="var(--pu-tx)">③ 二次 TurnPlan</text><text class="ts" x="590" y="359" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">快模型 · 仅前提被改变</text><rect x="711" y="312" width="199" height="66" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="810" y="340" text-anchor="middle" fill="var(--te-tx)">④ KP 叙事</text><text class="ts" x="810" y="359" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">主模型 · 工具循环</text><rect x="932" y="312" width="199" height="66" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="1032" y="340" text-anchor="middle" fill="var(--pu-tx)">⑤ TurnValidator</text><text class="ts" x="1032" y="359" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">快模型 · 预筛命中才调</text><line class="ln" x1="247" y1="345" x2="269" y2="345" marker-end="url(#a)"/><line class="ln" x1="468" y1="345" x2="490" y2="345" marker-end="url(#a)"/><line class="ln" x1="689" y1="345" x2="711" y2="345" marker-end="url(#a)"/><line class="ln" x1="910" y1="345" x2="932" y2="345" marker-end="url(#a)"/><line class="ln" x1="590" y1="246" x2="590" y2="278" marker-end="url(#a)"/><rect x="24" y="426" width="1132" height="116" rx="10" class="dash"/><text class="ts" x="38" y="446">三、落库与守卫（fail-closed：必须成功）</text><rect x="48" y="462" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="215" y="488" text-anchor="middle" fill="var(--gy-tx)">状态守卫</text><text class="ts" x="215" y="507" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">确保已裁定的落地</text><rect x="422" y="462" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="589" y="488" text-anchor="middle" fill="var(--gy-tx)">唯一序号落库</text><text class="ts" x="589" y="507" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">同事务内分配</text><rect x="796" y="462" width="334" height="62" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="963" y="488" text-anchor="middle" fill="var(--gy-tx)">广播 done</text><text class="ts" x="963" y="507" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">前端收束本轮</text><line class="ln" x1="382" y1="493" x2="422" y2="493" marker-end="url(#a)"/><line class="ln" x1="756" y1="493" x2="796" y2="493" marker-end="url(#a)"/><line class="ln" x1="590" y1="400" x2="590" y2="426" marker-end="url(#a)"/><rect x="24" y="566" width="1132" height="92" rx="10" class="dash"/><text class="ts" x="38" y="586">四、后台收尾（fail-open：失败即退化；三者彼此独立、无先后）</text><rect x="48" y="600" width="334" height="44" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="215" y="617" text-anchor="middle" fill="var(--co-tx)">滚动摘要</text><text class="ts" x="215" y="636" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">推进浓缩游标</text><rect x="422" y="600" width="334" height="44" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="589" y="617" text-anchor="middle" fill="var(--co-tx)">幕后推演</text><text class="ts" x="589" y="636" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">只落 KP 可见事件</text><rect x="796" y="600" width="334" height="44" rx="6" fill="var(--co-bg)" stroke="var(--co-ln)" stroke-width="1"/><text class="th" x="963" y="617" text-anchor="middle" fill="var(--co-tx)">场景配图</text><text class="ts" x="963" y="636" text-anchor="middle" fill="var(--co-tx)" opacity="0.78">回写 scene.image</text><line class="ln" x1="590" y1="542" x2="590" y2="566" marker-end="url(#a)"/></svg>
