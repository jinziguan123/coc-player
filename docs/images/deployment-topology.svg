<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img"><title>运行形态与部署拓扑</title><desc>客人机器的 SPA 经 Tauri 外壳里的 iroh 端点，通过 QUIC 隧道连到房主机器；房主机器上 FastAPI 同源托管前端，领域服务下接 SQLite、事件日志、向量检索、规则引擎与 LLM Provider，实时事件经 RoomHub 走 SSE。</desc><style>
svg{--bg:#FFFFFF;--card:#F7F6F2;--line:#B4B2A9;--txt:#2C2C2A;--txt2:#5F5E5A;
--pu-bg:#EEEDFE;--pu-ln:#7F77DD;--pu-tx:#26215C;
--te-bg:#E1F5EE;--te-ln:#1D9E75;--te-tx:#04342C;
--co-bg:#FAECE7;--co-ln:#D85A30;--co-tx:#4A1B0C;
--gy-bg:#F1EFE8;--gy-ln:#888780;--gy-tx:#2C2C2A}
@media (prefers-color-scheme:dark){svg{--bg:#1A1A18;--card:#232320;--line:#5F5E5A;--txt:#F1EFE8;--txt2:#B4B2A9;
--pu-bg:#3C3489;--pu-ln:#AFA9EC;--pu-tx:#EEEDFE;
--te-bg:#085041;--te-ln:#5DCAA5;--te-tx:#E1F5EE;
--co-bg:#712B13;--co-ln:#F0997B;--co-tx:#FAECE7;
--gy-bg:#444441;--gy-ln:#B4B2A9;--gy-tx:#F1EFE8}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--txt)}
.th{font-size:14px;font-weight:500;fill:var(--txt)}
.ts{font-size:12px;fill:var(--txt2)}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.dash{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:5 4}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1180" height="560" rx="12" fill="var(--bg)"/><rect x="24" y="40" width="236" height="260" rx="10" class="dash"/><text class="ts" x="38" y="60">客人机器</text><rect x="48" y="96" width="188" height="56" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="142" y="119" text-anchor="middle" fill="var(--pu-tx)">React SPA</text><text class="ts" x="142" y="138" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">客人自己的前端</text><rect x="48" y="216" width="188" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="142" y="241" text-anchor="middle" fill="var(--gy-tx)">iroh Endpoint</text><text class="ts" x="142" y="260" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">Tauri 外壳</text><line class="ln" x1="142" y1="152" x2="142" y2="216" marker-end="url(#a)"/><text class="ts" x="292" y="236" text-anchor="middle">QUIC 直连</text><text class="ts" x="292" y="254" text-anchor="middle">打不通走 relay</text><line class="dash" x1="240" y1="210" x2="344" y2="210" marker-start="url(#a)" marker-end="url(#a)"/><rect x="324" y="40" width="832" height="480" rx="10" class="dash"/><text class="ts" x="338" y="60">房主机器</text><rect x="352" y="76" width="200" height="56" rx="6" fill="var(--pu-bg)" stroke="var(--pu-ln)" stroke-width="1"/><text class="th" x="452" y="99" text-anchor="middle" fill="var(--pu-tx)">React SPA</text><text class="ts" x="452" y="118" text-anchor="middle" fill="var(--pu-tx)" opacity="0.78">同源托管</text><rect x="352" y="216" width="200" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="452" y="241" text-anchor="middle" fill="var(--gy-tx)">iroh Endpoint + 反代</text><text class="ts" x="452" y="260" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">Tauri 外壳</text><rect x="352" y="320" width="200" height="56" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="452" y="343" text-anchor="middle" fill="var(--gy-tx)">Tauri 外壳</text><text class="ts" x="452" y="362" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">spawn sidecar</text><rect x="624" y="216" width="176" height="56" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="712" y="239" text-anchor="middle" fill="var(--te-tx)">FastAPI</text><text class="ts" x="712" y="258" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">REST /api · SSE /live</text><rect x="880" y="76" width="248" height="60" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="1004" y="101" text-anchor="middle" fill="var(--te-tx)">RoomHub</text><text class="ts" x="1004" y="120" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">进程内广播 → SSE</text><rect x="872" y="216" width="256" height="56" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="1000" y="239" text-anchor="middle" fill="var(--te-tx)">领域服务</text><text class="ts" x="1000" y="258" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">session / turn / combat …</text><text class="ts" x="566" y="90" text-anchor="start">SSE /live</text><line class="ln" x1="552" y1="94" x2="880" y2="94" marker-end="url(#a)"/><text class="ts" x="596" y="150" text-anchor="start">REST /api</text><path class="ln" d="M552 118 H588 V232 H624" marker-end="url(#a)"/><line class="ln" x1="552" y1="244" x2="624" y2="244" marker-end="url(#a)"/><path class="ln" d="M552 348 H588 V258 H624" marker-end="url(#a)"/><line class="ln" x1="800" y1="244" x2="872" y2="244" marker-end="url(#a)"/><line class="ln" x1="1000" y1="216" x2="1000" y2="140" marker-end="url(#a)"/><rect x="352" y="424" width="139" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="422" y="449" text-anchor="middle" fill="var(--gy-tx)">SQLite</text><text class="ts" x="422" y="468" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">SQLAlchemy + Alembic</text><path class="ln" d="M1000 272 V392 H422 V424" marker-end="url(#a)"/><rect x="511" y="424" width="139" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="580" y="449" text-anchor="middle" fill="var(--gy-tx)">event_logs</text><text class="ts" x="580" y="468" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">事件日志与重放</text><path class="ln" d="M1000 272 V392 H580 V424" marker-end="url(#a)"/><rect x="670" y="424" width="139" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="740" y="449" text-anchor="middle" fill="var(--gy-tx)">向量检索</text><text class="ts" x="740" y="468" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">规则书 / 模组 / 事件</text><path class="ln" d="M1000 272 V392 H740 V424" marker-end="url(#a)"/><rect x="829" y="424" width="139" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="898" y="449" text-anchor="middle" fill="var(--gy-tx)">规则引擎</text><text class="ts" x="898" y="468" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">CoC 七版</text><path class="ln" d="M1000 272 V392 H898 V424" marker-end="url(#a)"/><rect x="988" y="424" width="139" height="60" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="1058" y="449" text-anchor="middle" fill="var(--gy-tx)">LLM Provider</text><text class="ts" x="1058" y="468" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">OpenAI 兼容 / Anthropic</text><path class="ln" d="M1000 272 V392 H1058 V424" marker-end="url(#a)"/></svg>
