<svg xmlns="http://www.w3.org/2000/svg" width="1702" height="972" viewBox="0 0 1702 972" role="img"><title>一轮对话的主链路时序</title><desc>玩家发言经 API 暂存并广播，确认齐后由 GenerationManager 唯一入口进入编排：规划器、AI 队友、二次规划、KP 叙事与工具循环、校验器，最后确定性落库与广播。</desc><style>
svg{--bg:#FFFFFF;--card:#F7F6F2;--line:#B4B2A9;--txt:#2C2C2A;--txt2:#5F5E5A;
--pu-bg:#EEEDFE;--pu-ln:#7F77DD;--pu-tx:#26215C;
--te-bg:#E1F5EE;--te-ln:#1D9E75;--te-tx:#04342C;
--co-bg:#FAECE7;--co-ln:#D85A30;--co-tx:#4A1B0C;
--gy-bg:#F1EFE8;--gy-ln:#888780;--gy-tx:#2C2C2A}
@media (prefers-color-scheme:dark){svg{--bg:#1A1A18;--card:#232320;--line:#5F5E5A;--txt:#F1EFE8;--txt2:#B4B2A9;
--pu-bg:#3C3489;--pu-ln:#AFA9EC;--pu-tx:#EEEDFE;
--te-bg:#085041;--te-ln:#5DCAA5;--te-tx:#E1F5EE;
--co-bg:#712B13;--co-ln:#F0997B;--co-tx:#FAECE7;
--gy-bg:#444441;--gy-ln:#B4B2A9;--gy-tx:#F1EFE8}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:var(--txt)}
.th{font-size:14px;font-weight:500;fill:var(--txt)}
.ts{font-size:12px;fill:var(--txt2)}
.ln{stroke:var(--line);stroke-width:1;fill:none}
.dash{stroke:var(--line);stroke-width:1;fill:none;stroke-dasharray:5 4}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1702" height="972" rx="12" fill="var(--bg)"/><rect x="28" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="104" y="64" text-anchor="middle" fill="var(--gy-tx)">前端</text><text class="ts" x="104" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">GameSessionPage</text><line class="dash" x1="104" y1="98" x2="104" y2="944"/><rect x="194" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="270" y="64" text-anchor="middle" fill="var(--gy-tx)">API</text><text class="ts" x="270" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">api/chat.py</text><line class="dash" x1="270" y1="98" x2="270" y2="944"/><rect x="360" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="436" y="64" text-anchor="middle" fill="var(--gy-tx)">会话域</text><text class="ts" x="436" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">session_service</text><line class="dash" x1="436" y1="98" x2="436" y2="944"/><rect x="526" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="602" y="64" text-anchor="middle" fill="var(--gy-tx)">生成锁</text><text class="ts" x="602" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">GenerationManager</text><line class="dash" x1="602" y1="98" x2="602" y2="944"/><rect x="692" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="768" y="64" text-anchor="middle" fill="var(--gy-tx)">编排</text><text class="ts" x="768" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">turn_orchestrator</text><line class="dash" x1="768" y1="98" x2="768" y2="944"/><rect x="858" y="40" width="152" height="58" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="934" y="64" text-anchor="middle" fill="var(--te-tx)">规划器</text><text class="ts" x="934" y="83" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">turn_planner</text><line class="dash" x1="934" y1="98" x2="934" y2="944"/><rect x="1024" y="40" width="152" height="58" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="1100" y="64" text-anchor="middle" fill="var(--te-tx)">队友</text><text class="ts" x="1100" y="83" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">team_turn_service</text><line class="dash" x1="1100" y1="98" x2="1100" y2="944"/><rect x="1190" y="40" width="152" height="58" rx="6" fill="var(--te-bg)" stroke="var(--te-ln)" stroke-width="1"/><text class="th" x="1266" y="64" text-anchor="middle" fill="var(--te-tx)">KP</text><text class="ts" x="1266" y="83" text-anchor="middle" fill="var(--te-tx)" opacity="0.78">KPAgent + 工具循环</text><line class="dash" x1="1266" y1="98" x2="1266" y2="944"/><rect x="1356" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="1432" y="64" text-anchor="middle" fill="var(--gy-tx)">规则/服务</text><text class="ts" x="1432" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">确定性执行</text><line class="dash" x1="1432" y1="98" x2="1432" y2="944"/><rect x="1522" y="40" width="152" height="58" rx="6" fill="var(--gy-bg)" stroke="var(--gy-ln)" stroke-width="1"/><text class="th" x="1598" y="64" text-anchor="middle" fill="var(--gy-tx)">实时</text><text class="ts" x="1598" y="83" text-anchor="middle" fill="var(--gy-tx)" opacity="0.78">RoomHub → SSE</text><line class="dash" x1="1598" y1="98" x2="1598" y2="944"/><line class="ln" x1="111" y1="132" x2="263" y2="132" marker-end="url(#a)"/><text class="ts" x="187" y="124" text-anchor="middle">POST /chat（行动 / 台词 / OOC）</text><line class="ln" x1="277" y1="172" x2="429" y2="172" marker-end="url(#a)"/><text class="ts" x="353" y="164" text-anchor="middle">写 pending_turn 事件</text><line class="ln" x1="277" y1="212" x2="1591" y2="212" marker-end="url(#a)"/><text class="ts" x="934" y="204" text-anchor="middle">广播事件与 turn_state</text><line class="ln" x1="111" y1="252" x2="263" y2="252" marker-end="url(#a)"/><text class="ts" x="187" y="244" text-anchor="middle">POST /advance</text><line class="ln" x1="277" y1="292" x2="429" y2="292" marker-end="url(#a)"/><text class="ts" x="353" y="284" text-anchor="middle">turn_confirm 齐 → commit_turn</text><line class="ln" x1="277" y1="332" x2="595" y2="332" marker-end="url(#a)"/><text class="ts" x="436" y="324" text-anchor="middle">start(run_chat_generation)</text><line class="ln" x1="609" y1="372" x2="761" y2="372" marker-end="url(#a)"/><text class="ts" x="685" y="364" text-anchor="middle">并发锁 + 房间配额 + in-flight buffer</text><line class="ln" x1="775" y1="412" x2="927" y2="412" marker-end="url(#a)"/><text class="ts" x="851" y="404" text-anchor="middle">① TurnPlan（快模型，温度 0，JSON）</text><line class="ln" x1="927" y1="452" x2="775" y2="452" marker-end="url(#a)"/><text class="ts" x="851" y="444" text-anchor="middle">裁定：检定 / 线索 / NPC / 场景 / 开战</text><line class="ln" x1="775" y1="492" x2="1093" y2="492" marker-end="url(#a)"/><text class="ts" x="934" y="484" text-anchor="middle">② AI 队友回合（主模型）</text><line class="ln" x1="1093" y1="532" x2="775" y2="532" marker-end="url(#a)"/><text class="ts" x="934" y="524" text-anchor="middle">队友行动与台词（暗骰不落库）</text><line class="ln" x1="775" y1="572" x2="927" y2="572" marker-end="url(#a)"/><text class="ts" x="851" y="564" text-anchor="middle">③ 二次 TurnPlan（仅当前提被改变）</text><line class="ln" x1="775" y1="612" x2="1259" y2="612" marker-end="url(#a)"/><text class="ts" x="1017" y="604" text-anchor="middle">④ 注入计划 + KP 上下文，流式叙事</text><line class="ln" x1="1273" y1="652" x2="1425" y2="652" marker-end="url(#a)"/><text class="ts" x="1349" y="644" text-anchor="middle">工具调用（掷骰 / SAN / 开战 / 切场景）</text><line class="ln" x1="1425" y1="692" x2="1273" y2="692" marker-end="url(#a)"/><text class="ts" x="1349" y="684" text-anchor="middle">确定性结果回注，或 suspend 等真人投骰</text><path class="ln" d="M768 724 h34 v18 h-34" marker-end="url(#a)"/><text class="ts" x="812" y="735" text-anchor="start">⑤ TurnValidator 落库前安检（预筛命中才调）</text><line class="ln" x1="775" y1="772" x2="1425" y2="772" marker-end="url(#a)"/><text class="ts" x="1100" y="764" text-anchor="middle">计划状态守卫：确保开战 / 伤害落地</text><line class="ln" x1="761" y1="812" x2="443" y2="812" marker-end="url(#a)"/><text class="ts" x="602" y="804" text-anchor="middle">持久化事件（唯一序号）</text><line class="ln" x1="775" y1="852" x2="1591" y2="852" marker-end="url(#a)"/><text class="ts" x="1183" y="844" text-anchor="middle">广播 token / 离散事件 / done</text><path class="ln" d="M768 884 h34 v18 h-34" marker-end="url(#a)"/><text class="ts" x="812" y="895" text-anchor="start">后台收尾：滚动摘要、幕后推演、配图</text></svg>
