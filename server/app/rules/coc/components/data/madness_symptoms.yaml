# 临时疯狂「一阵疯狂」症状表（参照 7e Bout of Madness — Summary 改编）。主键：key。
# 字段：key 标识 / label 名称 / manifest 言行表现（给 KP）/ penalty_skills 受惩罚的技能域
# / incapacitated 发作期间是否失能 / override 失能时由系统接管的行动描述

- key: amnesia
  label: 失忆
  manifest: 对刚刚发生的一切一片空白，茫然地反复追问自己身在何处、方才发生了什么
  penalty_skills:
  - 灵感
  - 知识
  - 教育
  - 历史
  - 回忆
  incapacitated: false
  override: ''
- key: blindness
  label: 癔症性失明
  manifest: 眼前骤然陷入漆黑，什么也看不见，只能伸手摸索
  penalty_skills:
  - 侦查
  - 观察
  - 图书馆使用
  - 阅读
  - 追踪
  - 侦察
  incapacitated: false
  override: ''
- key: deafness
  label: 癔症性失聪
  manifest: 世界骤然沉入死寂，听不见任何声音，答非所问
  penalty_skills:
  - 聆听
  incapacitated: false
  override: ''
- key: violence
  label: 暴力冲动
  manifest: 被无法遏制的暴力冲动攫住，对最近的目标（甚至同伴）发起攻击
  penalty_skills: []
  incapacitated: true
  override: violence
- key: paranoia
  label: 偏执妄想
  manifest: 疑神疑鬼，坚信身边有人（包括同伴）正密谋加害自己，拒绝信任与配合
  penalty_skills:
  - 话术
  - 取悦
  - 魅惑
  - 说服
  - 社交
  - 信用评级
  incapacitated: false
  override: ''
- key: significant_person
  label: 认错至亲
  manifest: 把在场某人错认成生命中挥之不去的重要之人，纠缠不休、情绪失控
  penalty_skills:
  - 话术
  - 侦查
  - 灵感
  incapacitated: false
  override: ''
- key: faint
  label: 昏厥
  manifest: 承受不住冲击，当场两眼一黑、瘫软昏厥倒地
  penalty_skills: []
  incapacitated: true
  override: faint
- key: flee
  label: 惊恐逃窜
  manifest: 彻底被恐惧支配，尖叫着不顾一切地夺路逃离现场，无视危险
  penalty_skills: []
  incapacitated: true
  override: flee
- key: hysteria
  label: 歇斯底里
  manifest: 情绪彻底失控，无法自抑地嚎啕大哭 / 狂笑 / 浑身剧烈颤抖
  penalty_skills:
  - 意志
  - 话术
  - 取悦
  - 社交
  incapacitated: false
  override: ''
- key: phobia_mania
  label: 恐惧发作
  manifest: 一种突如其来的强烈恐惧攫住理智，本能地回避、退缩、语无伦次
  penalty_skills:
  - 意志
  incapacitated: false
  override: ''
